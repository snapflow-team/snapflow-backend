name: Manual Stage Deploy

on:
  issue_comment:
    types: [ created ]

jobs:
  deploy:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/deploy-stage')

    runs-on: ubuntu-latest

    steps:
      # 🔹 Получаем данные PR
      - name: Get PR data
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput("head", pr.data.head.ref);
            core.setOutput("base", pr.data.base.ref);

      # 🔹 Разрешаем деплой только если PR → staging
      - name: Check target branch
        if: steps.pr.outputs.base != 'staging'
        run: |
          echo "PR is not targeting staging → deploy cancelled"
          exit 1

      # 🔹 Checkout ветки PR
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.pr.outputs.head }}

      # 🔹 Включаем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔹 Логин в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔹 Сборка и публикация образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/snapflow-core/Dockerfile
          push: true
          tags: snapflow365/snapflow-backend:stage
          build-args: |
            service=snapflow-core

      # 🔹 Деплой на VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/snapflow-stage
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f