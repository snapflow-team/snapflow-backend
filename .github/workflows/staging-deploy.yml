name: Manual Stage Deploy

on:
  issue_comment:
    types: [ created ]

jobs:
  deploy:
    if: >
      github.event.issue.pull_request && (
        contains(github.event.comment.body, '/deploy-stage-core') ||
        contains(github.event.comment.body, '/deploy-stage-files') ||
        contains(github.event.comment.body, '/deploy-stage-payments')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Get PR data
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("head", pr.data.head.ref);
            core.setOutput("base", pr.data.base.ref);

      - name: Check target branch
        if: steps.pr.outputs.base != 'staging'
        run: |
          echo "PR is not targeting staging → deploy cancelled"
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.pr.outputs.head }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push snapflow-core
        if: contains(github.event.comment.body, '/deploy-stage-core')
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/snapflow-core/Dockerfile
          push: true
          tags: snapflow365/snapflow-backend:stage
          build-args: |
            service=snapflow-core

      - name: Build and push snapflow-files
        if: contains(github.event.comment.body, '/deploy-stage-files')
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/files/Dockerfile
          push: true
          tags: snapflow365/snapflow-files:stage
          build-args: |
            service=files

      - name: Build and push snapflow-payments
        if: contains(github.event.comment.body, '/deploy-stage-payments')
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/payments/Dockerfile
          push: true
          tags: snapflow365/snapflow-payments:stage
          build-args: |
            service=payments

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/snapflow-stage
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f