name: Build, Push & Deploy Stage

on:
  push:
    branches: [ staging ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Забираем код
      - uses: actions/checkout@v3

      # 2️⃣ Включаем buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Логин в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Сборка и push образа (как у тебя)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/snapflow-core/Dockerfile
          push: true
          tags: snapflow365/snapflow-backend:stage
          build-args: |
            service=snapflow-core

      # 5️⃣ ДЕПЛОЙ НА VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/snapflow-stage
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f