apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true      # опционально, но хорошая практика
            runAsUser: 1000         # опционально
          ports:
            - containerPort: PORT_CONTAINER
          env:
            - name: FILES_TCP_HOST
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: FILES_TCP_HOST
            - name: FILES_TCP_PORT
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: FILES_TCP_PORT
            - name: SEND_INTERNAL_SERVER_ERROR_DETAILS
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: SEND_INTERNAL_SERVER_ERROR_DETAILS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: DATABASE_URL
            - name: PRISMA_LOG_QUERIES
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: PRISMA_LOG_QUERIES
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_SECRET_KEY
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_ENDPOINT
            - name: S3_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_PUBLIC_BASE_URL
            - name: S3_PRESIGNED_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_PRESIGNED_EXPIRES_IN
            - name: S3_POSTS_MEDIA_KEY_PREFIX
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_POSTS_MEDIA_KEY_PREFIX
            - name: S3_AVATARS_MEDIA_KEY_PREFIX
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: S3_AVATARS_MEDIA_KEY_PREFIX
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: snapflow-files-production-config-secret
                  key: NODE_ENV